name: Cleanup Old Redundant Releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Delete Old Redundant Releases and Tags
        run: npx tsx cleanup-releases.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
