name: Nightly Archive Sync

on:
  schedule:
    - cron: '5 0 * * *' # Runs 12:05 AM UTC every night
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Run Nightly Sync & Direct Upload
        run: npm run sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
