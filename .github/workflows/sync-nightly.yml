name: Nightly Archive Sync

on:
  schedule:
    - cron: '5 0 * * *' # Runs 12:05 AM UTC every night
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run sync
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          files: parquet/*.parquet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
