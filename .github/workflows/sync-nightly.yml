name: Nightly Archive Sync

on:
  schedule:
    - cron: '5 0 * * *' # Runs 12:05 AM UTC every night
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Nightly Sync
        run: npm run sync

      - name: Upload Parquet Files to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: parquet/*.parquet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
