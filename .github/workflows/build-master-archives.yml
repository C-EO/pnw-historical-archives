name: Build Master Historical Archives (2020-2025)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-master:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dataset: [nations, alliances, cities, wars, trades]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Merge Annual Archives into Master History for ${{ matrix.dataset }}
        run: npx tsx build-master.ts ${{ matrix.dataset }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
